name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall addons/pipecat_assist/app custom_components/pipecat_assist
      - name: Install lightweight test dependencies
        run: |
          python -m pip install "httpx>=0.28,<1"
      - name: Test ESPHome integration
        run: |
          python -m unittest \
            tests.test_va_pipecat_protocol \
            tests.test_esphome_provisioner \
            -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build add-on image
        run: |
          docker build \
            --tag pipecat-assist-ci \
            --build-arg BUILD_VERSION=dev \
            --build-arg BUILD_ARCH=amd64 \
            addons/pipecat_assist
      - name: Test ESPHome satellite transport in the add-on image
        run: |
          docker run --rm \
            --entrypoint python3 \
            --volume "${{ github.workspace }}/tests:/tests:ro" \
            pipecat-assist-ci \
            -m unittest discover -s /tests -v
